name: sync-climate

on:
  schedule:
    - cron: "0 3 1 */3 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-climate
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:climate
      - run: |
          if git diff --quiet -- public/data/climate; then
            echo "No climate data changes."
            exit 0
          fi
          git config user.name "verifiednepal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/climate
          git commit -m "chore: refresh climate data"
          git push
