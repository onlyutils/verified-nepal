name: deploy-prod

on: workflow_dispatch

permissions: {}

concurrency:
  group: deploy-prod

jobs:
  deploy:
    # Dispatch already needs write access; this pins prod to the owner even
    # if collaborators are ever added.
    if: github.actor == 'laxmanpokhrel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: ./infra/deploy.sh prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
