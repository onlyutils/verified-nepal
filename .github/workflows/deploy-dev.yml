name: deploy-dev

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: ./infra/deploy.sh dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # dev build wiring lives in repo variables, not in a committed .env
          VITE_CHAT_WIDGET_SRC: ${{ vars.VITE_CHAT_WIDGET_SRC }}
          VITE_CHAT_KEY: ${{ vars.VITE_CHAT_KEY }}
          VITE_CHAT_API: ${{ vars.VITE_CHAT_API }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_OU_CLIENT_ID: ${{ vars.VITE_OU_CLIENT_ID }}
