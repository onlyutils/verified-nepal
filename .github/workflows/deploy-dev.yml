name: deploy-dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without publishing to Cloudflare Pages
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set expected AWS account
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          account_id=$(printf '%s' "$AWS_ROLE_ARN" | cut -d: -f5)
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "AWS_ROLE_ARN must contain a 12-digit account id in field 5" >&2
            exit 1
          fi
          printf 'EXPECT_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Deploy
        run: infra/deploy.sh dev frontend ${{ inputs.dry_run && '--dry-run' || '' }}
